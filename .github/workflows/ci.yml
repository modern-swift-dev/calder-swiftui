name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs the same lint, build, and test jobs before publishing.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are cancelled; every push to main and every release tag keeps its own result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify Swift 6.4
        run: swift --version | grep -F 'Swift version 6.4'
      - name: Install lint tools
        run: |
          brew install mint actionlint
          mint bootstrap
      - name: Lint
        run: make lint

  apple:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
          - platform: iOS
            simulator-name: iPhone 17 Pro
            runtime-platform: iOS
            # Must match the runtime used to record snapshot baselines.
            runtime-version: '27.0'
          - platform: tvOS
            simulator-name: Apple TV 4K (3rd generation)
            runtime-platform: tvOS
            runtime-version: '27.0'
          - platform: visionOS
            simulator-name: Apple Vision Pro
            runtime-platform: visionOS
            runtime-version: '27.0'
          - platform: watchOS
            simulator-name: Apple Watch Series 12 (46mm)
            runtime-platform: watchOS
            runtime-version: '27.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Cache SwiftPM dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-
      - name: Install xcbeautify
        run: |
          brew install mint
          mint install cpisciotta/xcbeautify
      - name: Verify Xcode 27.2 and Swift 6.4
        run: |
          xcodebuild -version | grep -F 'Xcode 27.2' 2>&1 | mint run --no-install cpisciotta/xcbeautify -q
          swift --version | grep -F 'Swift version 6.4'
      - name: Ensure ${{ matrix.simulator-name }} simulator exists
        id: simulator
        if: matrix.platform != 'macOS'
        env:
          SIMULATOR_NAME: ${{ matrix.simulator-name }}
          RUNTIME_PLATFORM: ${{ matrix.runtime-platform }}
          RUNTIME_VERSION: ${{ matrix.runtime-version }}
        run: |
          device_identifier="$(bash Scripts/ensure-simulator.sh "$SIMULATOR_NAME" "$RUNTIME_PLATFORM" "$RUNTIME_VERSION")"
          echo "device-id=$device_identifier" >> "$GITHUB_OUTPUT"
      - name: Build for ${{ matrix.platform }}
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.device-id }}
        run: |
          if [ '${{ matrix.platform }}' = 'macOS' ]; then
            destination='platform=macOS'
          else
            destination="id=$SIMULATOR_ID"
          fi

          products=(
            CalderStdLib
            CalderSwiftUI
            CalderTheme
            CalderUIKit
          )
          for product in "${products[@]}"; do
            xcodebuild build -scheme "$product" -destination "$destination" 2>&1 | mint run --no-install cpisciotta/xcbeautify -q
          done
      - name: Boot ${{ matrix.simulator-name }}
        if: matrix.platform != 'macOS'
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.device-id }}
        # A newly created simulator stalls tests for minutes while it finishes its first boot.
        # Boot after building: booting during the build slows the build more than it saves.
        run: xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Test on ${{ matrix.platform }}
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.device-id }}
          # Swift Charts date axes also use the test process time zone.
          TEST_RUNNER_TZ: UTC
          RESULT_BUNDLE: ${{ runner.temp }}/${{ matrix.platform }}.xcresult
        run: |
          if [ '${{ matrix.platform }}' = 'macOS' ]; then
            destination='platform=macOS'
          else
            destination="id=$SIMULATOR_ID"
          fi

          # Two watchOS 27.0 runs with coverage skipped the CalderUIKitTests bundle and exited 65; that was never
          # seen without coverage, but the cause is unconfirmed (see #142 and #149).
          coverage=YES
          if [ '${{ matrix.platform }}' = 'watchOS' ]; then
            coverage=NO
          fi

          xcodebuild test -scheme Calder-Package -destination "$destination" \
            -enableCodeCoverage "$coverage" -resultBundlePath "$RESULT_BUNDLE" 2>&1 | mint run --no-install cpisciotta/xcbeautify -q
      - name: Report ${{ matrix.platform }} coverage
        if: ${{ !cancelled() && matrix.platform != 'watchOS' }}
        env:
          RESULT_BUNDLE: ${{ runner.temp }}/${{ matrix.platform }}.xcresult
        run: |
          if [ ! -d "$RESULT_BUNDLE" ]; then
            echo "::warning::No result bundle at $RESULT_BUNDLE; skipping the coverage summary."
            exit 0
          fi
          {
            echo '### ${{ matrix.platform }} code coverage'
            echo
            echo '| Target | Line coverage | Covered lines | Executable lines |'
            echo '| --- | ---: | ---: | ---: |'
            xcrun xccov view --report --only-targets --json "$RESULT_BUNDLE" |
              jq -r '.[] | select(.name | endswith("Tests") | not) | "| \(.name) | \(.lineCoverage * 10000 | round / 100)% | \(.coveredLines) | \(.executableLines) |"'
          } >> "$GITHUB_STEP_SUMMARY"

  catalyst:
    # Build-only: Mac Catalyst tests are not run.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Cache SwiftPM dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-
      - name: Install xcbeautify
        run: |
          brew install mint
          mint install cpisciotta/xcbeautify
      - name: Verify Xcode 27.2 and Swift 6.4
        run: |
          xcodebuild -version | grep -F 'Xcode 27.2' 2>&1 | mint run --no-install cpisciotta/xcbeautify -q
          swift --version | grep -F 'Swift version 6.4'
      - name: Build for Mac Catalyst
        run: |
          products=(
            CalderStdLib
            CalderSwiftUI
            CalderTheme
            CalderUIKit
          )
          for product in "${products[@]}"; do
            xcodebuild build -scheme "$product" -destination 'generic/platform=macOS,variant=Mac Catalyst' 2>&1 | mint run --no-install cpisciotta/xcbeautify -q
          done
