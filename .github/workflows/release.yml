name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

defaults:
  run:
    shell: bash

jobs:
  ci:
    # Lint and test on every platform before anything is published.
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    permissions:
      contents: write
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Cache SwiftPM dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-
      - name: Verify Xcode 27.0 and Swift 6.4
        run: |
          xcodebuild -version | grep -F 'Xcode 27.0'
          swift --version | grep -F 'Swift version 6.4'
      - name: Build documentation archive
        run: make documentation
      - name: Attach documentation archive to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          ARCHIVE: .build/documentation/Calder-Documentation.zip
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" --clobber
          else
            gh release create "$TAG" "$ARCHIVE" --verify-tag --title "$TAG" --generate-notes
          fi
